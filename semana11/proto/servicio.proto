// Contrato del servicio, semana 11. Dominio de referencia, inventario.
// El equipo reemplaza las operaciones y mensajes por los de su dominio.
//
// Reglas del contrato
//  1. Cada campo tiene un número. Ese número es lo que viaja por la red,
//     no el nombre. Un número usado no se reutiliza nunca.
//  2. Las operaciones que modifican estado llevan id_solicitud, la clave que
//     permite al servidor reconocer un reintento (semántica at-most-once).
//  3. Para agregar un campo nuevo se usa un número nuevo. Para eliminar uno
//     se marca como reserved.

syntax = "proto3";

package inventario.v1;

service Inventario {
  // Solo lectura, idempotente, se puede reintentar sin miedo
  rpc Listar (ListarSolicitud) returns (ListarRespuesta);

  // Modifican estado, NO idempotentes, necesitan id_solicitud
  rpc Agregar (MovimientoSolicitud) returns (StockRespuesta);
  rpc Quitar  (MovimientoSolicitud) returns (StockRespuesta);
}

message ListarSolicitud {}

message Item {
  string producto = 1;
  int32  stock    = 2;
}

message ListarRespuesta {
  repeated Item items = 1;
}

message MovimientoSolicitud {
  string id_solicitud = 1;   // lo genera el cliente, se repite igual en cada reintento
  string producto     = 2;
  int32  cantidad     = 3;
}

message StockRespuesta {
  string producto = 1;
  int32  stock    = 2;
}
