// Contrato del servicio, semana 11. Dominio de Sensores IoT.

syntax = "proto3";

package sensores.v1;

service ControlSensores {
  // Solo lectura, idempotente
  rpc Listar (ListarSolicitud) returns (ListarRespuesta);

  // Modifican estado, NO idempotentes, necesitan id_solicitud
  rpc Actualizar (ActualizarSolicitud) returns (SensorRespuesta);
  rpc Leer       (LeerSolicitud)       returns (SensorRespuesta);
}

message ListarSolicitud {}

message SensorItem {
  string sensor = 1;
  string valor  = 2;
}

message ListarRespuesta {
  repeated SensorItem items = 1;
}

message ActualizarSolicitud {
  string id_solicitud = 1;   // lo genera el cliente, clave para at-most-once
  string sensor       = 2;
  string valor        = 3;
}

message LeerSolicitud {
  string sensor = 1;
}

message SensorRespuesta {
  string sensor = 1;
  string valor  = 2;
}